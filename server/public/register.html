<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Cloud Inventory</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="subtitle">New accounts start as Viewer — ask an admin to upgrade your role</p>

      <div id="form-error" class="alert alert-error hidden" role="alert" aria-live="polite"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required autocomplete="name" aria-describedby="name-error" />
          <div class="field-message" id="name-error" aria-live="polite"></div>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error" />
          <div class="field-message" id="email-error" aria-live="polite"></div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="password-error" />
            <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <div class="field-message" id="password-error" aria-live="polite"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" aria-busy="false">Register</button>
      </form>

      <div class="switch-link">
        Already have an account? <a href="/index.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
