<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Cloud Inventory</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main-content">
      <div class="page-shell">
        <header class="page-header">
          <div>
            <p class="eyebrow">Overview</p>
            <h1>Dashboard</h1>
          </div>
          <a href="/reports.html" class="btn btn-secondary btn-sm">View reports</a>
        </header>

        <div id="dashboard-error" class="table-alert hidden" role="alert">
          <span id="dashboard-error-message"></span>
          <button type="button" class="btn btn-secondary btn-sm" id="retry-dashboard">Retry</button>
        </div>

        <div id="stat-loading" class="dashboard-skeleton" aria-live="polite" aria-busy="true">
          <div class="skeleton-metric"></div>
          <div class="skeleton-metric"></div>
          <div class="skeleton-metric"></div>
          <div class="skeleton-metric"></div>
        </div>

        <div id="stat-grid" class="stat-grid hidden" aria-live="polite">
          <div class="stat-card">
            <div class="label">Total Products</div>
            <div class="value" id="stat-total-products">-</div>
          </div>
          <div class="stat-card">
            <div class="label">Total Stock Value</div>
            <div class="value" id="stat-total-value">-</div>
          </div>
          <div class="stat-card alert">
            <div class="label">Low Stock Items</div>
            <div class="value" id="stat-low-stock">-</div>
          </div>
          <div class="stat-card">
            <div class="label">Movements Today</div>
            <div class="value" id="stat-movements-today">-</div>
          </div>
        </div>

        <div class="dashboard-grid">
          <section class="card">
            <div class="card-body">
              <div class="section-header">
                <h2>Low stock products</h2>
                <a href="/products.html" class="btn btn-secondary btn-sm">Review stock</a>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th scope="col">SKU</th>
                      <th scope="col">Product</th>
                      <th scope="col">Category</th>
                      <th scope="col" class="numeric-col">Quantity</th>
                      <th scope="col" class="numeric-col">Reorder Level</th>
                    </tr>
                  </thead>
                  <tbody id="low-stock-body"></tbody>
                </table>
              </div>
              <div id="low-stock-empty" class="empty-state hidden">No low-stock products right now.</div>
            </div>
          </section>

          <section class="card">
            <div class="card-body">
              <div class="section-header">
                <h2>Recent stock movements</h2>
                <a href="/stock.html" class="btn btn-secondary btn-sm">View all</a>
              </div>
              <ul id="movement-list" class="movement-list" aria-live="polite"></ul>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
