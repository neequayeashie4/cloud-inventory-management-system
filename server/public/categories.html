<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categories — Cloud Inventory</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main-content">
      <div class="page-shell">
        <div class="page-header">
          <div>
            <p class="eyebrow">Catalog</p>
            <h1>Categories</h1>
          </div>
          <button class="btn btn-primary" id="add-btn" type="button">+ Add Category</button>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="section-header">
              <h2>Category directory</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Created</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="categories-body"></tbody>
              </table>
            </div>
            <div id="empty-state" class="empty-state hidden">No categories yet.</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Category</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-error" class="alert alert-error hidden"></div>
        <form id="category-form">
          <input type="hidden" id="category-id" />
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" rows="3"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save Category</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
