<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Cloud Inventory</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main-content">
      <div class="page-shell">
        <div class="page-header">
          <div>
            <p class="eyebrow">Insights</p>
            <h1>Inventory Report</h1>
          </div>
          <span class="text-muted" id="report-count"></span>
        </div>

        <div id="table-error" class="table-alert hidden" role="alert">
          <span id="table-error-message"></span>
          <button type="button" class="btn btn-secondary btn-sm" id="retry-report">Retry</button>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="section-header">
              <h2>Inventory summary</h2>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th scope="col">SKU</th>
                    <th scope="col">Product</th>
                    <th scope="col">Category</th>
                    <th scope="col">Supplier</th>
                    <th scope="col" class="numeric-col">Quantity</th>
                    <th scope="col" class="numeric-col">Unit Price</th>
                    <th scope="col" class="numeric-col">Stock Value</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
              </table>
            </div>
            <div id="empty-state" class="empty-state hidden" aria-live="polite">
              <strong>No inventory data yet</strong>
              <span>Add products to see them summarized here.</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
