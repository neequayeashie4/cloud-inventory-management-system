<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Cloud Inventory</title>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand-pane">
      <div class="auth-brand-mark">CI</div>
      <h2 class="auth-brand-title">Cloud Inventory</h2>
      <p class="auth-brand-tagline">Track stock, manage suppliers, and keep every warehouse movement accounted for — from one dashboard.</p>
    </div>
    <div class="auth-form-pane">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to Cloud Inventory Management System</p>

        <div id="form-error" class="alert alert-error hidden" role="alert" aria-live="polite"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="email-error" />
            <div class="field-message" id="email-error" aria-live="polite"></div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" required autocomplete="current-password" aria-describedby="password-error" />
              <button type="button" class="password-toggle" aria-label="Show password" data-target="password">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <div class="field-message" id="password-error" aria-live="polite"></div>
          </div>
          <div class="auth-options">
            <label class="checkbox-label is-disabled" title="Not available yet">
              <input type="checkbox" disabled aria-disabled="true" />
              <span>Remember me</span>
            </label>
            <span class="auth-disabled-link" tabindex="-1" aria-disabled="true" title="Not available yet — ask an admin to reset your password">Forgot password?</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block" aria-busy="false">Log in</button>
        </form>

        <div class="switch-link">
          Don't have an account? <a href="/register.html">Register</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
