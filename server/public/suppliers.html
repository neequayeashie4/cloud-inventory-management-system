<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suppliers — Cloud Inventory</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Suppliers</h1>
        <button class="btn btn-primary" id="add-btn">+ Add Supplier</button>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Contact Person</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="suppliers-body"></tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state hidden">No suppliers yet.</div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Supplier</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modal-error" class="alert alert-error hidden"></div>
        <form id="supplier-form">
          <input type="hidden" id="supplier-id" />
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required />
          </div>
          <div class="form-group">
            <label for="contact_person">Contact Person</label>
            <input type="text" id="contact_person" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" />
            </div>
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="text" id="phone" />
            </div>
          </div>
          <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" rows="2"></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save Supplier</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/suppliers.js"></script>
</body>
</html>
